<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小车 · 遥控终端</title>
<style>
  :root{
    --bg:#05070d;
    --panel:rgba(13,20,34,.72);
    --line:rgba(56,189,248,.16);
    --line-hot:rgba(56,189,248,.55);
    --fg:#dbeafe;
    --dim:#5b6d86;
    --cyan:#22d3ee;
    --blue:#3b82f6;
    --ok:#22e06b;
    --err:#ff4d6a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1100px 620px at 50% -12%, rgba(34,211,238,.11), transparent 62%),
      radial-gradient(760px 460px at 88% 108%, rgba(59,130,246,.10), transparent 60%),
      var(--bg);
    color:var(--fg);
    font-family:system-ui,"Microsoft YaHei",sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:20px 16px;
    user-select:none; -webkit-tap-highlight-color:transparent;
    overflow-x:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      linear-gradient(rgba(56,189,248,.075) 1px, transparent 1px),
      linear-gradient(90deg, rgba(56,189,248,.075) 1px, transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(ellipse 90% 74% at 50% 36%, #000 42%, transparent 88%);
    -webkit-mask-image:radial-gradient(ellipse 90% 74% at 50% 36%, #000 42%, transparent 88%);
  }

  .wrap{width:100%; max-width:520px; position:relative; z-index:1}

  /* 两栏布局 */
  .cols{display:flex; flex-direction:column}
  .col-left,.col-right{display:flex; flex-direction:column; min-width:0}

  @media (min-width:900px){
    .wrap{max-width:min(1120px, 96vw)}
    .cols{display:grid; grid-template-columns:.92fr 1.08fr; gap:16px; align-items:start}
    .view-grid{height:380px}
    .brand h1{font-size:22px}
  }

  /* 大屏：铺满整个视口 */
  @media (min-width:1200px){
    body{padding:16px; height:100vh; overflow:hidden; align-items:stretch}
    .wrap{max-width:none; width:100%; height:100%;
          display:flex; flex-direction:column}
    .top{flex:0 0 auto; margin-bottom:14px}
    .cols{flex:1 1 auto; min-height:0; display:grid;
          grid-template-columns:.90fr 1.10fr; gap:18px; align-items:stretch}
    .col-left,.col-right{min-height:0; height:100%;
                         display:flex; flex-direction:column; gap:16px}
    .col-left>.card,.col-right>.card{margin-bottom:0}

    .view-card{flex:1 1 auto; min-height:0; display:flex; flex-direction:column}
    .view-grid{flex:1 1 auto; height:auto; min-height:200px}
    .col-right>.telemetry-card{flex:0 0 200px; min-height:0;
                               display:flex; flex-direction:column}
    #log{flex:1 1 auto; height:auto; min-height:90px}
    .tips{flex:0 0 auto; margin-top:12px}

    .card{padding:22px; border-radius:18px}
    .brand h1{font-size:26px; letter-spacing:5px}
    .brand .logo{width:44px; height:44px; font-size:22px; border-radius:13px}
    .btn{padding:16px 20px; font-size:15.5px; border-radius:14px}
    .pad{grid-template-columns:repeat(3, clamp(84px, 6.2vw, 124px));
         grid-template-rows:repeat(3, clamp(84px, 6.2vw, 124px)); gap:12px}
    .dir{font-size:clamp(24px, 1.7vw, 34px); border-radius:17px}
    #speedVal{font-size:28px}
    #yawVal{font-size:32px}
    .speed-box{max-width:min(540px, 100%)}
    #log{font-size:13px}
  }

  .top{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; padding:0 2px}
  .brand{display:flex; align-items:center; gap:11px}
  .logo{
    width:34px; height:34px; border-radius:10px; flex:0 0 auto;
    background:linear-gradient(140deg,var(--cyan),var(--blue));
    display:grid; place-items:center; font-size:17px;
    box-shadow:0 0 18px rgba(34,211,238,.45);
  }
  .brand h1{
    font-size:19px; font-weight:800; letter-spacing:4px;
    background:linear-gradient(92deg,#e0f2fe,var(--cyan) 55%,var(--blue));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .brand small{display:block; font-size:9.5px; letter-spacing:2.4px; color:var(--dim); margin-top:3px}

  .pill{
    display:flex; align-items:center; gap:7px;
    padding:6px 12px; border-radius:999px;
    background:rgba(255,255,255,.035);
    border:1px solid var(--line);
    font-size:11.5px; letter-spacing:.6px; color:var(--dim);
    transition:.25s;
  }
  .pill .dot{width:7px; height:7px; border-radius:50%; background:var(--dim); transition:.25s}
  .pill.on{color:var(--ok); border-color:rgba(34,224,107,.4); background:rgba(34,224,107,.07)}
  .pill.on .dot{background:var(--ok); box-shadow:0 0 10px var(--ok); animation:pulse 1.9s ease-in-out infinite}
  .pill.err{color:var(--err); border-color:rgba(255,77,106,.4); background:rgba(255,77,106,.07)}
  .pill.err .dot{background:var(--err); box-shadow:0 0 10px var(--err)}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.45;transform:scale(.82)}}

  .card{
    position:relative; background:var(--panel);
    border:1px solid var(--line); border-radius:16px; padding:16px;
    margin-bottom:12px;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    box-shadow:0 10px 34px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04);
  }
  .card::before,.card::after{
    content:""; position:absolute; width:14px; height:14px; pointer-events:none;
    border-color:var(--line-hot); border-style:solid; border-width:0;
  }
  .card::before{top:-1px; left:-1px; border-top-width:1.5px; border-left-width:1.5px; border-radius:16px 0 0 0}
  .card::after{bottom:-1px; right:-1px; border-bottom-width:1.5px; border-right-width:1.5px; border-radius:0 0 16px 0}

  .view-card{padding:0; overflow:hidden}
  .view-grid{position:relative; height:250px}
  .pane{position:relative; display:flex; flex-direction:column;
        height:100%; min-height:0}
  .pane-head{
    position:absolute; top:11px; left:14px; right:14px; z-index:2;
    display:flex; align-items:center; justify-content:space-between;
    font-size:10px; letter-spacing:2.2px; color:var(--dim); pointer-events:none;
  }
  #heading{
    font-family:ui-monospace,Consolas,monospace; font-size:12px;
    color:var(--cyan); letter-spacing:1px; text-shadow:0 0 12px rgba(34,211,238,.5);
    font-variant-numeric:tabular-nums;
  }
  #view2d{display:block; flex:1 1 auto; width:100%; min-height:0; cursor:grab}
  #view2d:active{cursor:grabbing}

  /* 3D 角标 */
  .pip{
    position:absolute; right:14px; bottom:14px; z-index:3;
    width:210px; height:140px;
    border-radius:12px; overflow:hidden;
    border:1px solid rgba(56,189,248,.42);
    background:rgba(5,10,20,.70);
    box-shadow:0 10px 28px rgba(0,0,0,.55);
  }
  .pip-label{
    position:absolute; top:5px; left:10px; z-index:2; pointer-events:none;
    font-size:9px; letter-spacing:2px; color:var(--dim);
  }
  #view3d{display:block; width:100%; height:100%; cursor:grab}
  #view3d:active{cursor:grabbing}

  /* 地图工具 */
  .map-tools{
    position:absolute; top:34px; right:14px; z-index:4;
    display:flex; gap:6px;
  }
  .tool{
    padding:5px 12px; border-radius:8px; cursor:pointer;
    font-size:11px; letter-spacing:1px; font-family:inherit;
    color:var(--dim); background:rgba(10,18,30,.7);
    border:1px solid var(--line);
    transition:.16s;
  }
  .tool:hover{color:#a5f3fc; border-color:var(--line-hot)}
  .tool.active{
    color:#04121f; background:linear-gradient(135deg,rgba(34,211,238,.9),rgba(59,130,246,.9));
    border-color:transparent;
  }
  .path-info{
    position:absolute; left:14px; bottom:14px; z-index:4;
    font-size:11px; letter-spacing:1px; color:var(--dim);
    font-family:ui-monospace,Consolas,monospace;
  }
  .path-tools{
    position:absolute; left:14px; bottom:44px; z-index:4;
    display:flex; gap:6px;
  }
  .mini{
    padding:6px 14px; border-radius:8px; cursor:pointer;
    font-size:11.5px; letter-spacing:1px; font-family:inherit;
    color:var(--fg); background:rgba(10,18,30,.75);
    border:1px solid var(--line);
    transition:.16s;
  }
  .mini:hover{background:rgba(56,189,248,.12); border-color:var(--line-hot)}
  .mini.primary{
    color:#04121f; background:linear-gradient(135deg,rgba(34,211,238,.9),rgba(59,130,246,.9));
    border-color:transparent; font-weight:600;
    box-shadow:0 0 16px rgba(34,211,238,.3);
  }
  .mini.primary:hover{box-shadow:0 0 24px rgba(34,211,238,.55); filter:brightness(1.08)}

  /* 遥测 */
  .telemetry-card{display:flex; flex-direction:column; min-height:168px}
  .tele-head{display:flex; align-items:center; justify-content:space-between;
             font-size:11px; letter-spacing:2px; color:var(--dim); margin-bottom:8px}
  .tele-head #telemHz{color:var(--cyan); font-family:ui-monospace,Consolas,monospace;
                      letter-spacing:.5px; font-size:11px}
  .tele-nums{display:flex; gap:20px; margin-bottom:8px;
             font-family:ui-monospace,Consolas,monospace; font-size:12px; color:var(--dim)}
  .tele-nums b{font-weight:700; font-variant-numeric:tabular-nums}
  .tele-nums .tl b{color:#67e8f9}
  .tele-nums .tr b{color:#ff8fa2}
  #chart{flex:1 1 auto; width:100%; min-height:74px; display:block}
  .tele-raw{
    font-family:ui-monospace,Consolas,monospace; font-size:10.5px;
    color:#3b4d66; letter-spacing:.5px; margin-top:6px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  @media (max-width:700px){
    .view-grid{height:230px}
    .pip{width:142px; height:98px; right:10px; bottom:10px}
  }

  .row{display:flex; gap:10px}
  .btn{
    flex:1; padding:12px 14px; border-radius:12px;
    border:1px solid var(--line); background:rgba(255,255,255,.03);
    color:var(--fg); font-size:13.5px; font-weight:600; letter-spacing:1px;
    font-family:inherit; cursor:pointer; transition:.18s;
  }
  .btn:hover:not(:disabled){background:rgba(56,189,248,.09); border-color:var(--line-hot)}
  .btn:active:not(:disabled){transform:scale(.975)}
  .btn:disabled{opacity:.32; cursor:not-allowed}
  .btn-main{
    background:linear-gradient(135deg, rgba(34,211,238,.9), rgba(59,130,246,.9));
    border-color:transparent; color:#04121f;
    box-shadow:0 0 20px rgba(34,211,238,.28);
  }
  .btn-main:hover:not(:disabled){box-shadow:0 0 28px rgba(34,211,238,.5); filter:brightness(1.08)}
  .btn-stop{color:#ff8fa2; border-color:rgba(255,77,106,.35); background:rgba(255,77,106,.07)}
  .btn-stop:hover:not(:disabled){background:rgba(255,77,106,.16); border-color:rgba(255,77,106,.6)}

  .pad-wrap{display:flex; flex-direction:column; align-items:center; gap:18px}
  .pad{
    display:grid;
    grid-template-columns:repeat(3, 74px);
    grid-template-rows:repeat(3, 74px);
    gap:9px;
  }
  .dir{
    border-radius:14px; border:1px solid var(--line);
    background:linear-gradient(160deg, rgba(56,189,248,.08), rgba(255,255,255,.015));
    color:var(--cyan); font-size:21px;
    display:grid; place-items:center; cursor:pointer;
    transition:.13s; position:relative; overflow:hidden;
  }
  .dir::after{
    content:""; position:absolute; inset:0;
    background:radial-gradient(circle at 50% 50%, rgba(34,211,238,.45), transparent 70%);
    opacity:0; transition:.18s;
  }
  .dir:hover{border-color:var(--line-hot); color:#a5f3fc}
  .dir:hover::after{opacity:.28}
  .dir:active,.dir.active{
    transform:scale(.94); border-color:var(--cyan);
    box-shadow:0 0 24px rgba(34,211,238,.55), inset 0 0 18px rgba(34,211,238,.2);
    color:#fff;
  }
  .dir:active::after,.dir.active::after{opacity:.7}
  .empty{visibility:hidden}
  .stop-key{
    border-radius:50% !important;
    background:radial-gradient(circle at 50% 40%, rgba(255,77,106,.2), rgba(255,77,106,.05)) !important;
    border-color:rgba(255,77,106,.4) !important;
    color:#ff8fa2 !important; font-size:17px !important;
  }
  .stop-key:hover{box-shadow:0 0 20px rgba(255,77,106,.4)}
  .stop-key:active{box-shadow:0 0 26px rgba(255,77,106,.7) !important; border-color:#ff4d6a !important}

  .speed-box{width:100%; max-width:320px}  .speed-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:9px}
  .speed-head span:first-child{font-size:11px; letter-spacing:2px; color:var(--dim)}
  #speedVal{
    font-family:ui-monospace,Consolas,monospace;
    font-size:21px; font-weight:700; color:var(--cyan);
    text-shadow:0 0 14px rgba(34,211,238,.55);
    font-variant-numeric:tabular-nums;
  }
  #speedVal::after{content:"%"; font-size:12px; opacity:.6; margin-left:1px}

  #yawVal{
    font-family:ui-monospace,Consolas,monospace;
    font-size:23px; font-weight:700; color:var(--cyan);
    text-shadow:0 0 16px rgba(34,211,238,.6);
    font-variant-numeric:tabular-nums;
  }
  #yawVal::after{content:"°"; font-size:13px; opacity:.6; margin-left:1px}
  .yaw-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px}
  .yaw-head span:first-child{font-size:11px; letter-spacing:2px; color:var(--dim)}
  .yaw-row{display:flex; gap:10px; margin-top:14px}
  input[type=range]{
    -webkit-appearance:none; appearance:none;
    width:100%; height:5px; border-radius:99px; outline:none;
    background:linear-gradient(90deg,var(--cyan),var(--blue)) no-repeat, rgba(255,255,255,.08);
    background-size:var(--fill,100%) 100%;
    cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:19px; height:19px; border-radius:50%;
    background:#e0f7ff; border:2px solid var(--cyan);
    box-shadow:0 0 14px rgba(34,211,238,.85); transition:.15s;
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.14)}
  input[type=range]::-moz-range-thumb{
    width:17px; height:17px; border-radius:50%;
    background:#e0f7ff; border:2px solid var(--cyan);
    box-shadow:0 0 14px rgba(34,211,238,.85);
  }

  .log-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; font-size:11px; letter-spacing:2px; color:var(--dim)}
  #log{
    height:118px; overflow-y:auto;
    background:rgba(2,6,14,.72);
    border:1px solid rgba(56,189,248,.1); border-radius:10px;
    padding:9px 11px;
    font-family:ui-monospace,Consolas,monospace;
    font-size:12px; line-height:1.75; color:var(--dim);
  }
  #log::-webkit-scrollbar{width:5px}
  #log::-webkit-scrollbar-thumb{background:rgba(56,189,248,.28); border-radius:9px}
  #log:empty::before{content:"等待连接串口…"; color:#2b3a52; font-size:11.5px; letter-spacing:1.5px}
  #log .ln{display:flex; gap:9px; animation:fadein .22s ease}
  @keyframes fadein{from{opacity:0; transform:translateY(-3px)} to{opacity:1; transform:none}}
  #log .t{color:#334155; flex:0 0 auto}
  #log .tx{color:var(--cyan)}
  #log .er{color:var(--err)}
  #log .ok{color:var(--ok)}

  .tips{text-align:center; font-size:11px; color:var(--dim); margin-top:12px; line-height:1.9; letter-spacing:.4px}
  kbd{
    display:inline-block; padding:1px 6px; margin:0 1px; border-radius:5px;
    font-family:ui-monospace,Consolas,monospace; font-size:10.5px; color:#a5f3fc;
    background:rgba(56,189,248,.1);
    border:1px solid var(--line); border-bottom-width:2px;
  }
  @media (max-width:430px){
    .pad{grid-template-columns:repeat(3,64px); grid-template-rows:repeat(3,64px); gap:8px}
    .dir{font-size:18px; border-radius:12px}
    body{padding:14px 12px}
    .pane{height:190px}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">
      <div class="logo">◈</div>
      <div>
        <h1>小车</h1>
        <small>REMOTE&nbsp;TERMINAL</small>
      </div>
    </div>
    <div class="pill" id="status"><span class="dot"></span><span id="statusText">离线</span></div>
  </div>

  <div class="cols">
  <div class="col-left">

  <div class="card">
    <div class="row">
      <button id="btnConn" class="btn btn-main">连接串口</button>
      <button id="btnStop" class="btn btn-stop" disabled>紧急停车</button>
    </div>
  </div>

  <!-- 航向设定 -->
  <div class="card">
    <div class="yaw-head"><span>目标航向</span><span id="yawVal">000</span></div>
    <input id="yaw" type="range" min="0" max="359" value="0" step="1">
    <div class="yaw-row">
      <button id="btnTurn" class="btn btn-main">确认转向</button>
      <button id="btnZero" class="btn">归零</button>
    </div>
  </div>

  <div class="card">
    <div class="pad-wrap">
      <div class="pad">
        <button class="dir empty"></button>
        <button class="dir" data-cmd="F">▲</button>
        <button class="dir empty"></button>

        <button class="dir" data-cmd="L">◀</button>
        <button class="dir stop-key" data-cmd="S">■</button>
        <button class="dir" data-cmd="R">▶</button>

        <button class="dir empty"></button>
        <button class="dir" data-cmd="B">▼</button>
        <button class="dir empty"></button>
      </div>

      <div class="speed-box">
        <div class="speed-head"><span>速度</span><span id="speedVal">100</span></div>
        <input id="speed" type="range" min="20" max="100" value="100" step="10">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="log-head"><span>指令流</span><span id="count">0</span></div>
    <div id="log"></div>
  </div>

  </div>
  <div class="col-right">

  <div class="card view-card">
    <div class="view-grid">
      <div class="pane">
        <div class="pane-head"><span>俯视图</span><span id="heading">YAW 000°</span></div>

        <div class="map-tools">
          <button class="tool active" id="btnLive">跟随真机</button>
          <button class="tool active" data-mode="draw">画线</button>
          <button class="tool" data-mode="orbit">拖转</button>
        </div>

        <div class="path-tools">
          <button id="btnUndo" class="mini">撤销</button>
          <button id="btnClear" class="mini">清空</button>
          <button id="btnRun" class="mini primary">执行路径</button>
        </div>
        <div class="path-info"><span id="wpCount">0</span> 点　·　<span id="wpLen">0</span> cm</div>

        <canvas id="view2d"></canvas>
        <div class="pip">
          <div class="pip-label">3D</div>
          <canvas id="view3d"></canvas>
        </div>
      </div>
    </div>
  </div>

  <div class="card telemetry-card">
    <div class="tele-head"><span>遥测</span><span id="telemHz">-- Hz</span></div>
    <div class="tele-nums">
      <span class="tl">L <b id="tLt">0.0</b> → <b id="tLm">0.0</b> rpm</span>
      <span class="tr">R <b id="tRt">0.0</b> → <b id="tRm">0.0</b> rpm</span>
    </div>
    <canvas id="chart"></canvas>
    <div class="tele-raw" id="telemRaw">原始: —</div>
  </div>

  </div>
  </div>

  <div class="tips">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 或方向键　·　<kbd>空格</kbd> 停车　·　松手自动停<br>
    拖动车模可以自由查看
  </div>

</div>

<script>
'use strict';

/* ===== 双视图车模 · 纯 Canvas 软件渲染 ===== */
(function initCar(){
  const cv3 = document.getElementById('view3d');
  const cv2 = document.getElementById('view2d');
  if (!cv3 || !cv2) return;
  const ctx3 = cv3.getContext('2d');
  const ctx2 = cv2.getContext('2d');
  const $heading = document.getElementById('heading');

  let W3 = 0, H3 = 0, D3 = 1, F3 = 1;
  let W2 = 0, H2 = 0, D2 = 1, S2 = 100;

  let yaw = Math.PI * 0.82;
  let yawShown = yaw;

  const PITCH  = -0.58;   /* 负 = 相机在上方俯视 */
  const DIST   = 0.95;
  const LOOK_Y = 0.055;

  /* ---------- 几何 ---------- */
  const parts = [];

  /* 沿 z 切成若干片 —— 让深度排序更准，避免大面积互相穿透 */
  function box(x0,y0,z0, x1,y1,z1, color, slices){
    const n  = slices || 1;
    const dz = (z1 - z0) / n;
    const f = [
      [0,1,2,3],[4,5,6,7],
      [0,1,5,4],[3,2,6,7],
      [0,3,7,4],[1,2,6,5]
    ];
    for (let k = 0; k < n; k++){
      const za = z0 + dz*k, zb = za + dz;
      const v = [
        [x0,y0,za],[x1,y0,za],[x1,y1,za],[x0,y1,za],
        [x0,y0,zb],[x1,y0,zb],[x1,y1,zb],[x0,y1,zb]
      ];
      parts.push({ v, f, color });
    }
  }

  function wheel(cx, cy, cz, r, w, color){
    const seg = 12;
    const v = [], f = [];
    for (let i = 0; i < seg; i++){
      const a = i / seg * Math.PI * 2;
      const yy = cy + Math.cos(a) * r;
      const zz = cz + Math.sin(a) * r;
      v.push([cx - w/2, yy, zz]);
      v.push([cx + w/2, yy, zz]);
    }
    for (let i = 0; i < seg; i++){
      const a = i*2, b = ((i+1) % seg)*2;
      f.push([a, b, b+1, a+1]);
    }
    const capL = [], capR = [];
    for (let i = 0; i < seg; i++){ capL.push(i*2); capR.push(i*2+1); }
    f.push(capL); f.push(capR);
    parts.push({ v, f, color });
  }

  box(-0.100, 0.022, -0.125,  0.100, 0.068,  0.125, [88, 98, 118], 5); /* 车身 20×25cm */
  box(-0.068, 0.068, -0.048,  0.068, 0.112,  0.035, [28, 32, 40], 2);  /* 座舱 */
  box(-0.055, 0.074,  0.035,  0.055, 0.106,  0.041, [34, 211, 238], 1);
  box(-0.078, 0.032,  0.125,  0.078, 0.052,  0.132, [34, 211, 238], 1);
  box(-0.078, 0.032, -0.132,  0.078, 0.046, -0.125, [255, 77, 106], 1);

  wheel(-0.108, 0.033,  0.080, 0.033, 0.018, [16, 20, 28]);
  wheel( 0.108, 0.033,  0.080, 0.033, 0.018, [16, 20, 28]);
  wheel(-0.108, 0.033, -0.080, 0.033, 0.018, [16, 20, 28]);
  wheel( 0.108, 0.033, -0.080, 0.033, 0.018, [16, 20, 28]);

  /* ---------- 数学 ---------- */
  const LN = [-0.42, 0.82, -0.39];

  function rotY(p, a){
    const c = Math.cos(a), s = Math.sin(a);
    return [p[0]*c + p[2]*s, p[1], -p[0]*s + p[2]*c];
  }
  function rotX(p, a){
    const c = Math.cos(a), s = Math.sin(a);
    return [p[0], p[1]*c - p[2]*s, p[1]*s + p[2]*c];
  }
  function normalOf(pts){
    const a = pts[0], b = pts[1], c = pts[2];
    const u = [b[0]-a[0], b[1]-a[1], b[2]-a[2]];
    const w = [c[0]-a[0], c[1]-a[1], c[2]-a[2]];
    let n = [u[1]*w[2]-u[2]*w[1], u[2]*w[0]-u[0]*w[2], u[0]*w[1]-u[1]*w[0]];
    const L = Math.hypot(n[0], n[1], n[2]) || 1;
    return [n[0]/L, n[1]/L, n[2]/L];
  }
  function rgb(color, k){
    return 'rgb(' +
      Math.min(255, color[0]*k).toFixed(0) + ',' +
      Math.min(255, color[1]*k).toFixed(0) + ',' +
      Math.min(255, color[2]*k).toFixed(0) + ')';
  }

  /* ---------- 3D 透视 ---------- */
  function project3(p){
    const z = p[2] + DIST;
    if (z < 0.05) return null;
    const k = F3 / z;
    return [W3/2 + p[0]*k, H3*0.46 - (p[1] - LOOK_Y)*k];
  }

  function draw3D(){
    ctx3.clearRect(0, 0, W3, H3);

    const g = ctx3.createRadialGradient(W3/2, H3*0.66, 0, W3/2, H3*0.66, W3*0.5);
    g.addColorStop(0, 'rgba(34,211,238,.12)');
    g.addColorStop(1, 'rgba(34,211,238,0)');
    ctx3.fillStyle = g;
    ctx3.fillRect(0, 0, W3, H3);

    /* 地面网格（固定） */
    ctx3.lineWidth = 1 * D3;
    ctx3.strokeStyle = 'rgba(56,189,248,.14)';
    const R = 1.2, ST = 0.25;
    for (let i = -R; i <= R + 1e-6; i += ST){
      grid3([i-pose.x, 0, -R-pose.z], [i-pose.x, 0, R-pose.z]);
      grid3([-R-pose.x, 0, i-pose.z], [R-pose.x, 0, i-pose.z]);
    }

    drawPath3D();

    /* 阴影 */
    const sh = [[-0.11,0.005,-0.14],[0.11,0.005,-0.14],[0.11,0.005,0.14],[-0.11,0.005,0.14]]
      .map(p => project3(rotX(rotY(p, yawShown), PITCH)));
    if (sh.every(Boolean)){
      ctx3.beginPath();
      ctx3.moveTo(sh[0][0], sh[0][1]);
      for (let i=1;i<4;i++) ctx3.lineTo(sh[i][0], sh[i][1]);
      ctx3.closePath();
      ctx3.fillStyle = 'rgba(0,0,0,.45)';
      ctx3.fill();
    }

    /* 车体 */
    const faces = [];
    for (const part of parts){
      const vs = part.v.map(p => rotX(rotY(p, yawShown), PITCH));
      for (const idx of part.f){
        const pts = idx.map(i => vs[i]);
        const n = normalOf(pts);
        let zs = 0;
        for (const p of pts) zs += p[2];
        const nl = Math.abs(n[0]*LN[0] + n[1]*LN[1] + n[2]*LN[2]);
        const k = 0.34 + 0.66*nl + 0.12*Math.abs(n[1]);
        faces.push({ d: zs/pts.length, pts, fill: rgb(part.color, k) });
      }
    }
    faces.sort((a,b) => b.d - a.d);

    for (const f of faces){
      const sp = [];
      let ok = true;
      for (const p of f.pts){
        const s = project3(p);
        if (!s){ ok = false; break; }
        sp.push(s);
      }
      if (!ok) continue;
      ctx3.beginPath();
      ctx3.moveTo(sp[0][0], sp[0][1]);
      for (let i=1;i<sp.length;i++) ctx3.lineTo(sp[i][0], sp[i][1]);
      ctx3.closePath();
      ctx3.fillStyle = f.fill;
      ctx3.fill();
      ctx3.lineWidth = 0.8*D3;
      ctx3.strokeStyle = 'rgba(56,189,248,.34)';
      ctx3.stroke();
    }
  }

  /* 3D 里的路径：相机跟随车，所以世界坐标要减去 pose */
  function drawPath3D(){
    if (pathPts.length < 2) return;

    ctx3.save();
    ctx3.lineJoin = 'round';
    ctx3.lineCap  = 'round';
    ctx3.strokeStyle = 'rgba(34,211,238,.85)';
    ctx3.lineWidth = Math.max(1.5, 2.4*D3);
    ctx3.beginPath();
    let started = false;
    for (const p of pathPts){
      const sp = project3(rotX([p[0]-pose.x, 0.004, p[1]-pose.z], PITCH));
      if (!sp){ started = false; continue; }
      if (started) ctx3.lineTo(sp[0], sp[1]);
      else { ctx3.moveTo(sp[0], sp[1]); started = true; }
    }
    ctx3.stroke();
    ctx3.restore();

    /* 回程线 */
    if (routePts.length > pathPts.length){
      ctx3.save();
      ctx3.setLineDash([5*D3, 5*D3]);
      ctx3.strokeStyle = 'rgba(251,191,36,.85)';
      ctx3.lineWidth = Math.max(1.2, 1.8*D3);
      ctx3.beginPath();
      let ok = false;
      for (let i = 0; i < 2; i++){
        const sp = project3(rotX([routePts[i][0]-pose.x, 0.004, routePts[i][1]-pose.z], PITCH));
        if (!sp) continue;
        if (i && ok) ctx3.lineTo(sp[0], sp[1]); else { ctx3.moveTo(sp[0], sp[1]); ok = true; }
      }
      ctx3.stroke();
      ctx3.restore();
    }
  }

  function grid3(a, b){
    const sa = project3(rotX(a, PITCH));
    const sb = project3(rotX(b, PITCH));
    if (!sa || !sb) return;
    ctx3.beginPath();
    ctx3.moveTo(sa[0], sa[1]);
    ctx3.lineTo(sb[0], sb[1]);
    ctx3.stroke();
  }

  /* ---------- 俯视（正交） ---------- */
  function project2(p){
    return [W2/2 + p[0]*S2, H2*0.50 - p[2]*S2];
  }

  function draw2D(){
    ctx2.clearRect(0, 0, W2, H2);

    const g = ctx2.createRadialGradient(W2/2, H2*0.54, 0, W2/2, H2*0.54, W2*0.55);
    g.addColorStop(0, 'rgba(34,211,238,.10)');
    g.addColorStop(1, 'rgba(34,211,238,0)');
    ctx2.fillStyle = g;
    ctx2.fillRect(0, 0, W2, H2);

    ctx2.lineWidth = 1 * D2;
    ctx2.strokeStyle = 'rgba(56,189,248,.16)';
    const R = 1.2, ST = 0.25;
    for (let i = -R; i <= R + 1e-6; i += ST){
      grid2([i,0,-R],[i,0,R]); grid2([-R,0,i],[R,0,i]);
    }

    drawPath();

    const sh = [[-0.11,-0.14],[0.11,-0.14],[0.11,0.14],[-0.11,0.14]]
      .map(p => { const r = rotY([p[0], 0, p[1]], yawShown);
                  return project2([r[0]+pose.x, 0, r[2]+pose.z]); });
    ctx2.beginPath();
    ctx2.moveTo(sh[0][0], sh[0][1]);
    for (let i=1;i<4;i++) ctx2.lineTo(sh[i][0], sh[i][1]);
    ctx2.closePath();
    ctx2.fillStyle = 'rgba(0,0,0,.45)';
    ctx2.fill();

    /* 俯视只看得见朝上的面：按高度从低到高画 */
    const faces = [];
    for (const part of parts){
      const vs = part.v.map(p => {
        const r = rotY(p, yawShown);
        return [r[0]+pose.x, r[1], r[2]+pose.z];
      });
      for (const idx of part.f){
        const pts = idx.map(i => vs[i]);
        const n = normalOf(pts);
        const ay = Math.abs(n[1]);
        if (ay < 0.35) continue;
        let ys = 0;
        for (const p of pts) ys += p[1];
        const shade = 0.78 + 0.42*ay;
        faces.push({ d: ys/pts.length, pts, fill: rgb(part.color, shade) });
      }
    }
    faces.sort((a,b) => a.d - b.d);

    for (const f of faces){
      const sp = f.pts.map(project2);
      ctx2.beginPath();
      ctx2.moveTo(sp[0][0], sp[0][1]);
      for (let i=1;i<sp.length;i++) ctx2.lineTo(sp[i][0], sp[i][1]);
      ctx2.closePath();
      ctx2.fillStyle = f.fill;
      ctx2.fill();
    }
  }

  function grid2(a, b){
    const sa = project2(a);
    const sb = project2(b);
    ctx2.beginPath();
    ctx2.moveTo(sa[0], sa[1]);
    ctx2.lineTo(sb[0], sb[1]);
    ctx2.stroke();
  }

  /* ---------- 主循环 ---------- */
  let lastT = performance.now();

  function frame(){
    const now = performance.now();
    if (now - lastT < 22){ requestAnimationFrame(frame); return; }
    const dt = Math.min((now - lastT) / 1000, 0.06);
    lastT = now;

    if (execDist >= 0){
      if (execPhase === 'align'){
        /* 原地转到朝回路径的方向，再开始走 */
        if (Math.abs(angleDiff(yaw, yawShown)) < 0.12) execPhase = 'drive';
      } else {
        const sp = document.getElementById('speed');
        const v  = (8 + (Number(sp ? sp.value : 100) - 20) * 0.25) / 100;  /* m/s */
        execDist += v * dt;
        if (execDist >= totalLen()){
          execDist = -1;
          if (window.onPathDone) window.onPathDone();
        }
        if (execDist >= 0) poseAt(execDist);
      }
    }

    /* 手动行驶：沿车头方向前后移动 */
    if (execDist < 0 && driveDir !== 0){
      const sp = document.getElementById('speed');
      const v  = (8 + (Number(sp ? sp.value : 100) - 20) * 0.25) / 100;  /* m/s */
      pose.x += Math.sin(yawShown) * driveDir * v * dt;
      pose.z += Math.cos(yawShown) * driveDir * v * dt;
      pose.x = Math.max(-1.45, Math.min(1.45, pose.x));
      pose.z = Math.max(-1.45, Math.min(1.45, pose.z));
    }

    /* 跟随真机：空闲时用车端上来的航向 */
    const live = window.carLive;
    if (live && live.follow && live.yawDeg !== null &&
        execDist < 0 && driveDir === 0){
      yaw = live.yawDeg * Math.PI / 180;
    }

    let d = yaw - yawShown;
    while (d >  Math.PI) d -= Math.PI*2;
    while (d < -Math.PI) d += Math.PI*2;
    yawShown += d * 0.12;

    draw3D();
    draw2D();
    requestAnimationFrame(frame);
  }

  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);

    let r = cv3.getBoundingClientRect();
    D3 = dpr;
    cv3.width  = Math.max(1, Math.round(r.width  * dpr));
    cv3.height = Math.max(1, Math.round(r.height * dpr));
    W3 = cv3.width; H3 = cv3.height;
    F3 = H3 * 1.75;

    r = cv2.getBoundingClientRect();
    D2 = dpr;
    cv2.width  = Math.max(1, Math.round(r.width  * dpr));
    cv2.height = Math.max(1, Math.round(r.height * dpr));
    W2 = cv2.width; H2 = cv2.height;
    S2 = Math.min(W2, H2) / 2.4;
  }

  /* ---------- 地图路径 ---------- */
  const pathPts = [];        /* 世界坐标 [x, z]，1 单位 = 1 米 */
  const pose = { x: 0, z: 0 };   /* 车在世界里的位置 */
  let execDist = -1;             /* >=0 表示正在沿路径行驶（米） */
  let driveDir = 0;              /* +1 前进 / -1 后退 / 0 停 */
  const CM_PER_M = 100;
  let drawMode = 'draw';
  let painting = false;

  const $wpCount = document.getElementById('wpCount');
  const $wpLen   = document.getElementById('wpLen');

  function mapToWorld(sx, sy){
    return [(sx - W2/2) / S2, -(sy - H2*0.50) / S2];
  }
  function mapToScreen(wx, wz){
    return [W2/2 + wx*S2, H2*0.50 - wz*S2];
  }
  function pathLength(){
    let L = 0;
    for (let i = 1; i < pathPts.length; i++){
      L += Math.hypot(pathPts[i][0]-pathPts[i-1][0], pathPts[i][1]-pathPts[i-1][1]);
    }
    return L * CM_PER_M;
  }
  let routePts = [];        /* 实际行驶折线（可能含"回路线"） */
  let execPhase = 'drive';  /* align = 先掉头；drive = 沿路线走 */

  function angleDiff(a, b){
    let d = a - b;
    while (d >  Math.PI) d -= Math.PI*2;
    while (d < -Math.PI) d += Math.PI*2;
    return d;
  }

  /* 折线总长 */
  function lenOf(pts){
    let L = 0;
    for (let i = 1; i < pts.length; i++){
      L += Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]);
    }
    return L;
  }
  function totalLen(){ return lenOf(routePts); }

  /* 按弧长取位姿 */
  function poseAt(d){
    let acc = 0;
    for (let i = 1; i < routePts.length; i++){
      const a = routePts[i-1], b = routePts[i];
      const seg = Math.hypot(b[0]-a[0], b[1]-a[1]);
      if (acc + seg >= d || i === routePts.length-1){
        const t = seg > 0.0001 ? Math.min(1, (d-acc)/seg) : 0;
        pose.x = a[0] + (b[0]-a[0])*t;
        pose.z = a[1] + (b[1]-a[1])*t;
        yaw = Math.atan2(b[0]-a[0], b[1]-a[1]);
        return;
      }
      acc += seg;
    }
  }

  /* 求路径上离 (px,pz) 最近的点 */
  function nearestOnPath(px, pz){
    let best = { d: 1e9, x: pathPts[0][0], z: pathPts[0][1], seg: 0 };
    for (let i = 1; i < pathPts.length; i++){
      const a = pathPts[i-1], b = pathPts[i];
      const dx = b[0]-a[0], dz = b[1]-a[1];
      const L2 = dx*dx + dz*dz;
      let t = L2 > 1e-9 ? ((px-a[0])*dx + (pz-a[1])*dz) / L2 : 0;
      t = Math.max(0, Math.min(1, t));
      const x = a[0] + dx*t, z = a[1] + dz*t;
      const d = Math.hypot(px-x, pz-z);
      if (d < best.d) best = { d, x, z, seg: i-1 };
    }
    return best;
  }

  function updatePathInfo(){
    if ($wpCount) $wpCount.textContent = pathPts.length;
    if ($wpLen)   $wpLen.textContent   = Math.round(pathLength());
  }

  function drawPath(){
    /* 回路线：从当前位置到路径最近点（虚线） */
    if (routePts.length > pathPts.length){
      ctx2.save();
      ctx2.setLineDash([6*D2, 6*D2]);
      ctx2.strokeStyle = 'rgba(251,191,36,.75)';
      ctx2.lineWidth = Math.max(1.5, 2*D2);
      ctx2.beginPath();
      for (let i = 0; i < 2; i++){
        const p = mapToScreen(routePts[i][0], routePts[i][1]);
        i ? ctx2.lineTo(p[0], p[1]) : ctx2.moveTo(p[0], p[1]);
      }
      ctx2.stroke();
      ctx2.restore();
    }

    if (pathPts.length < 2) return;

    ctx2.save();
    ctx2.lineJoin = 'round';
    ctx2.lineCap  = 'round';
    ctx2.strokeStyle = 'rgba(34,211,238,.95)';
    ctx2.lineWidth = Math.max(2, 2.8*D2);
    ctx2.beginPath();
    for (let i = 0; i < pathPts.length; i++){
      const p = mapToScreen(pathPts[i][0], pathPts[i][1]);
      if (i) ctx2.lineTo(p[0], p[1]); else ctx2.moveTo(p[0], p[1]);
    }
    ctx2.stroke();
    ctx2.restore();

    /* 航点 */
    ctx2.fillStyle = 'rgba(224,247,255,.92)';
    for (const pt of pathPts){
      const p = mapToScreen(pt[0], pt[1]);
      ctx2.beginPath();
      ctx2.arc(p[0], p[1], Math.max(2, 2.0*D2), 0, Math.PI*2);
      ctx2.fill();
    }

    /* 终点圈 */
    const last = pathPts[pathPts.length-1];
    const e = mapToScreen(last[0], last[1]);
    ctx2.beginPath();
    ctx2.arc(e[0], e[1], Math.max(4, 5.5*D2), 0, Math.PI*2);
    ctx2.strokeStyle = 'rgba(34,211,238,1)';
    ctx2.lineWidth = Math.max(1.5, 2*D2);
    ctx2.stroke();
  }

  /* ---------- 对外接口 ---------- */
  window.carMap = {
    start(){
      if (pathPts.length < 2) return false;

      const d0 = Math.hypot(pose.x - pathPts[0][0], pose.z - pathPts[0][1]);

      if (d0 < 0.04){
        /* 就在起点：直接跑原路径 */
        routePts = pathPts.map(p => [p[0], p[1]]);
        execPhase = 'drive';
      } else {
        /* 不在起点：先回最近的路径点，再从那里续跑 */
        const near = nearestOnPath(pose.x, pose.z);
        const alreadyOn = near.d < 0.05;
        routePts = [];
        if (!alreadyOn){
          routePts.push([pose.x, pose.z]);
          routePts.push([near.x, near.z]);
        } else {
          routePts.push([near.x, near.z]);
        }
        for (let i = near.seg + 1; i < pathPts.length; i++){
          routePts.push([pathPts[i][0], pathPts[i][1]]);
        }
        if (routePts.length < 2){
          const end = pathPts[pathPts.length-1];
          routePts.push([end[0], end[1]]);
        }
        execPhase = 'align';
      }

      execDist = 0;
      poseAt(0);
      return true;
    },
    stop(){ execDist = -1; routePts = []; },
    place(x, z){ pose.x = x; pose.z = z; },
    setDrive(d){ driveDir = d; },
    running(){ return execDist >= 0; },
    reset(){ execDist = -1; routePts = []; pose.x = 0; pose.z = 0; },
    clear(){ pathPts.length = 0; routePts = []; execDist = -1; pose.x = 0; pose.z = 0; updatePathInfo(); },
    undo(){ pathPts.pop(); updatePathInfo(); },
    setMode(m){
      drawMode = m;
      cv2.style.cursor = (m === 'draw') ? 'crosshair' : 'grab';
    },
    count(){ return pathPts.length; },
    /* 生成路径指令： P x0,y0;x1,y1;...  （单位 cm，车体坐标系） */
    command(){
      if (!pathPts.length) return null;
      const body = pathPts.map(p =>
        Math.round(p[0]*CM_PER_M) + ',' + Math.round(p[1]*CM_PER_M));
      return 'P' + body.join(';');
    }
  };

  window.addEventListener('resize', resize);
  if (window.ResizeObserver){
    try{ const ro = new ResizeObserver(() => resize()); ro.observe(cv3); ro.observe(cv2); }catch(e){}
  }
  resize();
  frame();

  /* 演示路径（地址栏加 #demo 可见） */
  /* 演示：只喂遥测（含真实航向），不跑路径 */
  if (location.hash.indexOf('live') >= 0){
    let kk = 0;
    setInterval(() => {
      kk++;
      const yawDeg = Math.round(Math.sin(kk * 0.07) * 150);
      const l = 1400 + Math.round(Math.sin(kk*0.3)*40);
      const r = 1400 + Math.round(Math.cos(kk*0.25)*40);
      onTelemetry('1500 1500 ' + l + ' ' + r + ' ' + yawDeg);
    }, 100);
  }

  if (location.hash.indexOf('demo') >= 0){
    pathPts.push([-0.45,-0.55],[-0.45,0.25],[0.15,0.55],[0.60,0.10],[0.35,-0.55]);
    updatePathInfo();

    if (location.hash.indexOf('demo2') >= 0){
      /* 车先被开离路线，再执行路径 —— 演示"开回去接上路线" */
      setTimeout(() => {
        window.carMap.place(-1.00, -0.15);
        window.carMap.start();
      }, 300);
    } else {
      setTimeout(() => window.carMap.start(), 250);
      let k = 0;
      const demoTele = setInterval(() => {
        k++;
        const tl = 150, tr = 100;
        const ml = tl - 6 + Math.sin(k*0.5)*5;
        const mr = tr - 12 + Math.sin(k*0.33+1)*9;
        onTelemetry((tl*10|0)+' '+(tr*10|0)+' '+(ml*10|0)+' '+(mr*10|0));
        if (k > 120) clearInterval(demoTele);
      }, 60);
    }
  }

  window.carView = {
    steer(dir, dt){ yaw += dir * 2.0 * dt; },
    setYawDeg(deg){ yaw = deg * Math.PI / 180; },
    getTargetDeg(){
      let d = Math.round(yaw * 180 / Math.PI) % 360;
      if (d < 0) d += 360;
      return d;
    }
  };

  setInterval(() => {
    let deg = Math.round(yawShown * 180 / Math.PI) % 360;
    if (deg < 0) deg += 360;
    $heading.textContent = 'YAW ' + String(deg).padStart(3, '0') + '°';
  }, 80);

  /* 3D 小窗：拖动旋转 */
  (function(){
    let dragging = false, lastX = 0;
    cv3.addEventListener('pointerdown', e => {
      dragging = true; lastX = e.clientX;
      try{ cv3.setPointerCapture(e.pointerId); }catch(err){}
    });
    cv3.addEventListener('pointermove', e => {
      if (!dragging) return;
      yaw += (e.clientX - lastX) * 0.012;
      lastX = e.clientX;
      if (window.syncYawSlider) window.syncYawSlider();
    });
    const end = () => { dragging = false; };
    cv3.addEventListener('pointerup', end);
    cv3.addEventListener('pointercancel', end);
    cv3.addEventListener('pointerleave', end);
  })();

  /* 俯视图：画线模式 = 画路径；拖转模式 = 旋转车头 */
  (function(){
    let dragging = false, lastX = 0;

    function localPos(e){
      const r = cv2.getBoundingClientRect();
      return [(e.clientX - r.left) * D2, (e.clientY - r.top) * D2];
    }
    function pushPoint(sx, sy){
      const w = mapToWorld(sx, sy);
      if (pathPts.length){
        const q = pathPts[pathPts.length-1];
        if (Math.hypot(w[0]-q[0], w[1]-q[1]) * S2 < 6) return;
      }
      pathPts.push(w);
      updatePathInfo();
    }

    cv2.addEventListener('pointerdown', e => {
      try{ cv2.setPointerCapture(e.pointerId); }catch(err){}
      if (drawMode === 'draw'){
        painting = true;
        pathPts.length = 0;
        const p = localPos(e);
        pushPoint(p[0], p[1]);
      } else {
        dragging = true; lastX = e.clientX;
      }
    });

    cv2.addEventListener('pointermove', e => {
      if (painting){
        const p = localPos(e);
        pushPoint(p[0], p[1]);
      } else if (dragging){
        yaw += (e.clientX - lastX) * 0.012;
        lastX = e.clientX;
        if (window.syncYawSlider) window.syncYawSlider();
      }
    });

    const end = () => { painting = false; dragging = false; updatePathInfo(); };
    cv2.addEventListener('pointerup', end);
    cv2.addEventListener('pointercancel', end);
    cv2.addEventListener('pointerleave', end);
  })();
})();


/* ===== 转向 → 车模 ===== */
let steerDir = 0;

(function steerLoop(){
  let last = performance.now();
  function tick(t){
    const dt = Math.min((t - last) / 1000, 0.05);
    last = t;
    if (steerDir !== 0 && window.carView) carView.steer(steerDir, dt);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();


/* 串口 */
let port = null, writer = null, busy = false, sent = 0;

const $status     = document.getElementById('status');
const $statusText = document.getElementById('statusText');
const $log        = document.getElementById('log');
const $conn       = document.getElementById('btnConn');
const $stop       = document.getElementById('btnStop');
const $speed      = document.getElementById('speed');
const $speedV     = document.getElementById('speedVal');
const $count      = document.getElementById('count');

function setStatus(text, cls){
  $statusText.textContent = text;
  $status.className = 'pill' + (cls ? ' ' + cls : '');
}

function log(msg, kind){
  const t = new Date().toLocaleTimeString('zh-CN', { hour12:false });
  const el = document.createElement('div');
  el.className = 'ln';
  const ts = document.createElement('span');
  ts.className = 't';
  ts.textContent = t;
  const ms = document.createElement('span');
  ms.className = kind || '';
  ms.textContent = msg;
  el.appendChild(ts);
  el.appendChild(ms);
  $log.appendChild(el);
  while ($log.children.length > 120) $log.removeChild($log.firstChild);
  $log.scrollTop = $log.scrollHeight;
  if (kind === 'tx') $count.textContent = ++sent;
}

/* ---------- 遥测 ---------- */
const $telemHz  = document.getElementById('telemHz');
const $telemRaw = document.getElementById('telemRaw');
const $tLt = document.getElementById('tLt');
const $tLm = document.getElementById('tLm');
const $tRt = document.getElementById('tRt');
const $tRm = document.getElementById('tRm');
const chartCv = document.getElementById('chart');
const chartCx = chartCv ? chartCv.getContext('2d') : null;

window.carLive = window.carLive || { yawDeg: null, follow: true };

const HIST_MAX = 240;                 /* 240 点 @5Hz ≈ 48 秒 */
const hist = { tl: [], tr: [], ml: [], mr: [] };
let telemCount = 0, telemT0 = 0;
let reader = null, reading = false;

function onTelemetry(line){
  const raw = line.trim();
  if ($telemRaw) $telemRaw.textContent = '\u539f\u59cb: ' + raw.slice(0, 60);
  const parts = raw.split(/\s+/);
  if (parts.length < 4) return;
  const v = parts.slice(0, 5).map(Number);
  if (v.some(x => !isFinite(x))) return;

  const d = { tl: v[0]/10, tr: v[1]/10, ml: v[2]/10, mr: v[3]/10 };

  if (v.length >= 5) carLive.yawDeg = v[4];   /* 车端报上来的真实航向 */
  for (const k in hist){
    hist[k].push(d[k]);
    if (hist[k].length > HIST_MAX) hist[k].shift();
  }

  if ($tLt) $tLt.textContent = d.tl.toFixed(1);
  if ($tLm) $tLm.textContent = d.ml.toFixed(1);
  if ($tRt) $tRt.textContent = d.tr.toFixed(1);
  if ($tRm) $tRm.textContent = d.mr.toFixed(1);

  drawChart();

  telemCount++;
  const now = performance.now();
  if (!telemT0) telemT0 = now;
  if (now - telemT0 > 1200){
    if ($telemHz) $telemHz.textContent = (telemCount*1000/(now-telemT0)).toFixed(1) + ' Hz';
    telemCount = 0; telemT0 = now;
  }
}

function drawChart(){
  if (!chartCx) return;
  const cv = chartCv, cx = chartCx;
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  const r = cv.getBoundingClientRect();
  const W = Math.max(1, Math.round(r.width  * dpr));
  const H = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== W || cv.height !== H){ cv.width = W; cv.height = H; }

  cx.clearRect(0, 0, W, H);

  const n = hist.ml.length;
  if (n < 2) return;

  let lo = Infinity, hi = -Infinity;
  for (const k in hist) for (const v of hist[k]){ if (v<lo) lo=v; if (v>hi) hi=v; }
  if (hi - lo < 10){ const m = (hi+lo)/2; lo = m-10; hi = m+10; }
  const padY = (hi-lo)*0.12; lo -= padY; hi += padY;

  const xOf = i => W - ((n-1-i)/(HIST_MAX-1)) * W;
  const yOf = v => H - ((v-lo)/(hi-lo)) * (H-2) - 1;

  /* 网格 */
  cx.strokeStyle = 'rgba(56,189,248,.10)';
  cx.lineWidth = 1*dpr;
  for (let g = 0; g <= 2; g++){
    const yy = (H-2)*g/2 + 1;
    cx.beginPath(); cx.moveTo(0, yy); cx.lineTo(W, yy); cx.stroke();
  }

  function line(arr, color, width, dash){
    cx.beginPath();
    for (let i = 0; i < n; i++){
      const px = xOf(i), py = yOf(arr[i]);
      i ? cx.lineTo(px, py) : cx.moveTo(px, py);
    }
    cx.strokeStyle = color;
    cx.lineWidth = width*dpr;
    cx.setLineDash(dash ? [4*dpr, 4*dpr] : []);
    cx.stroke();
    cx.setLineDash([]);
  }

  line(hist.tl, 'rgba(103,232,249,.45)', 1.2, true);   /* 左目标 */
  line(hist.tr, 'rgba(255,143,162,.45)', 1.2, true);   /* 右目标 */
  line(hist.ml, 'rgba(34,211,238,1)',    2.0, false);  /* 左实测 */
  line(hist.mr, 'rgba(255,77,106,1)',    2.0, false);  /* 右实测 */
}

async function startReader(){
  if (reading || !port || !port.readable) return;
  reading = true;
  reader = port.readable.getReader();
  let buf = '';
  try{
    while (reading){
      const { value, done } = await reader.read();
      if (done) break;
      buf += new TextDecoder().decode(value);
      let idx;
      while ((idx = buf.indexOf('\n')) >= 0){
        const line = buf.slice(0, idx);
        buf = buf.slice(idx + 1);
        if (line.trim()) onTelemetry(line);
      }
      if (buf.length > 2048) buf = '';
    }
  }catch(e){
  }finally{
    reading = false;
    try{ reader.releaseLock(); }catch(e){}
    reader = null;
  }
}

function stopReader(){
  reading = false;
  try{ if (reader) reader.cancel(); }catch(e){}
}

async function connect(){
  if (!('serial' in navigator)){
    setStatus('需 Chrome', 'err');
    log('此浏览器不支持 Web Serial，请用 Chrome / Edge', 'er');
    return;
  }
  try{
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 9600 });
    writer = port.writable.getWriter();
    startReader();
    setStatus('已连接', 'on');
    $conn.textContent = '断开连接';
    $conn.classList.remove('btn-main');
    $stop.disabled = false;
    log('串口已打开 · 9600 8N1', 'ok');
  }catch(e){
    setStatus('连接失败', 'err');
    log('连接失败：' + (e.message || e), 'er');
    port = null;
  }
}

async function disconnect(){
  try{ if (writer) await send('S'); }catch(e){}
  stopReader();
  try{ if (writer){ writer.releaseLock(); writer = null; } }catch(e){}
  try{ if (port){ await port.close(); port = null; } }catch(e){}
  setStatus('离线');
  $conn.textContent = '连接串口';
  $conn.classList.add('btn-main');
  $stop.disabled = true;
  log('已断开', 'er');
}

$conn.onclick = () => (port ? disconnect() : connect());
$stop.onclick = () => emergencyStop();

async function send(cmd){
  if (!writer || busy) return;
  busy = true;
  try{
    await writer.write(new TextEncoder().encode(cmd + '\n'));
    log('→ ' + cmd, 'tx');
  }catch(e){
    log('发送失败：' + (e.message || e), 'er');
    disconnect();
  }finally{
    busy = false;
  }
}

function withSpeed(letter){
  const v = Number($speed.value);
  return v >= 100 ? letter : letter + v;
}

function updateSpeedUI(){
  $speedV.textContent = $speed.value;
  $speed.style.setProperty('--fill', (($speed.value - 20) / 80 * 100) + '%');
}
$speed.oninput = updateSpeedUI;
updateSpeedUI();

/* ---------- 航向拉条 ---------- */
const $yaw      = document.getElementById('yaw');
const $yawVal   = document.getElementById('yawVal');
const $btnTurn  = document.getElementById('btnTurn');
const $btnZero  = document.getElementById('btnZero');

function paintYaw(deg, moveModel){
  deg = ((deg % 360) + 360) % 360;
  $yaw.value = deg;
  $yawVal.textContent = String(deg).padStart(3, '0');
  $yaw.style.setProperty('--fill', (deg / 359 * 100) + '%');
  if (moveModel && window.carView) carView.setYawDeg(deg);
  if (moveModel) $yaw.dataset.moved = '1';
}

/* 拖拽车模后，把拉条同步过去 */
window.syncYawSlider = function(){
  if (!window.carView) return;
  const deg = carView.getTargetDeg();
  $yaw.value = deg;
  $yawVal.textContent = String(deg).padStart(3, '0');
  $yaw.style.setProperty('--fill', (deg / 359 * 100) + '%');
};

$yaw.oninput = () => paintYaw(Number($yaw.value), true);
$btnZero.onclick = () => { paintYaw(0, true);

 log('航向归零'); };
$btnTurn.onclick = () => {
  const deg = Number($yaw.value);
  if (!writer){ log('未连接，无法发送转向指令', 'er'); return; }
  send('Y' + deg);
  log('目标航向 ' + deg + '°', 'ok');
};
paintYaw(0, true);

const KEYMAP = {
  w:'F', arrowup:'F',
  s:'B', arrowdown:'B',
  a:'L', arrowleft:'L',
  d:'R', arrowright:'R'
};
let heldKey = null;

function flash(cmd){
  const b = document.querySelector('[data-cmd="' + cmd + '"]');
  if (!b) return;
  b.classList.add('active');
  setTimeout(() => b.classList.remove('active'), 110);
}

document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.altKey || e.metaKey) return;

  if (e.key === ' '){
    e.preventDefault();
    flash('S');
    emergencyStop();
    return;
  }
  const k = e.key.toLowerCase();
  const cmd = KEYMAP[k];
  if (!cmd) return;

  e.preventDefault();
  if (e.repeat) return;

  heldKey = k;
  if (cmd === 'L') steerDir = -1;
  if (cmd === 'R') steerDir =  1;
  if (cmd === 'F' && window.carMap) carMap.setDrive(1);
  if (cmd === 'B' && window.carMap) carMap.setDrive(-1);
  flash(cmd);
  send(withSpeed(cmd));
});

document.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k === ' ' || !KEYMAP[k]) return;
  if (heldKey === k){
    heldKey = null;
    steerDir = 0;
    if (window.carMap) carMap.setDrive(0);
    send('S');
  }
});

document.querySelectorAll('[data-cmd]').forEach(btn => {
  const cmd = btn.dataset.cmd;
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (cmd === 'L') steerDir = -1;
    if (cmd === 'R') steerDir =  1;
    if (cmd === 'F' && window.carMap) carMap.setDrive(1);
    if (cmd === 'B' && window.carMap) carMap.setDrive(-1);
    send(withSpeed(cmd));
  });
  const stop = e => {
    e.preventDefault();
    steerDir = 0;
    if (window.carMap) carMap.setDrive(0);
    if (cmd !== 'S') send('S');
  };
  btn.addEventListener('pointerup', stop);
  btn.addEventListener('pointerleave', stop);
  btn.addEventListener('pointercancel', stop);
});

window.addEventListener('blur', () => { steerDir = 0; send('S'); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ steerDir = 0; send('S'); }
});

/* ---------- 地图路径按钮 ---------- */
document.querySelectorAll('[data-mode]').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('[data-mode]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    if (window.carMap) carMap.setMode(b.dataset.mode);
  };
});

const $btnUndo  = document.getElementById('btnUndo');
const $btnClear = document.getElementById('btnClear');
const $btnRun   = document.getElementById('btnRun');

if ($btnUndo)  $btnUndo.onclick  = () => { if (window.carMap) carMap.undo(); };
if ($btnClear) $btnClear.onclick = () => {
  if (!window.carMap) return;
  carMap.clear();
  if ($btnRun) $btnRun.textContent = '执行路径';
};

if ($btnRun) $btnRun.onclick = () => {
  if (!window.carMap) return;

  if (carMap.running()){
    carMap.stop();
    $btnRun.textContent = '执行路径';
    log('已停止', 'er');
    return;
  }

  const cmd = carMap.command();
  if (!cmd){ log('先在地图上画一条路线', 'er'); return; }

  carMap.start();
  $btnRun.textContent = '停止';
  log('开始沿路径行驶 · ' + carMap.count() + ' 个航点', 'ok');

  if (writer){ send(cmd); log('路径已下发', 'ok'); }
  else { log('未连接，仅页面预览', 'er'); }
};

function emergencyStop(){
  if (window.carMap){
    carMap.stop();
    carMap.setDrive(0);
  }
  if ($btnRun) $btnRun.textContent = '执行路径';
  steerDir = 0;
  send('S');
  log('紧急停车', 'er');
}

const $btnLive = document.getElementById('btnLive');
if ($btnLive) $btnLive.onclick = () => {
  carLive.follow = !carLive.follow;
  $btnLive.classList.toggle('active', carLive.follow);
  log(carLive.follow ? '跟随真机：开' : '跟随真机：关', 'ok');
};

window.onPathDone = () => {
  if ($btnRun) $btnRun.textContent = '执行路径';
  log('已到达终点', 'ok');
};

if ('serial' in navigator){
  navigator.serial.addEventListener('disconnect', () => {
    log('设备已拔出', 'er');
    disconnect();
  });
} else {
  setStatus('需 Chrome', 'err');
  log('此浏览器不支持 Web Serial', 'er');
}
</script>
